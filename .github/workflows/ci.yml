on: push

jobs:
  test:
    runs-on: ubuntu-latest
    name: OTP ${{matrix.otp}} / Elixir ${{matrix.elixir}}
    strategy:
      matrix:
        # OTP patches between 25.3.2.16 / 26.2.5.6 / 27.1.3 and the versions below
        # tightened X.509 extended-key-usage validation (erlang/otp
        # GHSA-qw6r-qh9v-638v) and reject builds.hex.pm's certificate, breaking
        # `mix local.hex`. 26.2.5.15 and 27.3.4.3 are the patches that relaxed it
        # again; OTP 25 got no such patch, so 25.3.2.15 is the last one that works.
        otp: ['24.3.4.17', '25.3.2.15', '26.2.5.15', '27.3.4.3']
        elixir: ['1.14.5', '1.15.8', '1.16.3', '1.17.3', '1.18.2', '1.19.5']
        # Version compatibility: https://hexdocs.pm/elixir/compatibility-and-deprecations.html#between-elixir-and-erlang-otp
        exclude:
          - otp: 27.3.4.3
            elixir: 1.14.5
          - otp: 27.3.4.3
            elixir: 1.15.8
          - otp: 27.3.4.3
            elixir: 1.16.3
          - otp: 24.3.4.17
            elixir: 1.17.3
          - otp: 24.3.4.17
            elixir: 1.18.2
          - otp: 24.3.4.17
            elixir: 1.19.5
          - otp: 25.3.2.15 # Elixir 1.19 supports OTP 26-28
            elixir: 1.19.5
    steps:
      - uses: actions/checkout@v3
      - uses: erlef/setup-beam@v1.18.2
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}
          version-type: strict
      - run: mix deps.get
      - run: mix test --cover
